## Brain-JEPA config adapted for single-GPU pretraining
## Effective batch size = batch_size * accumulation_steps = 4 * 32 = 128

data:
  batch_size: 4
  crop_size:
  - 450   # number of ROIs (50 subcortical + 400 cortical)
  - 160   # timepoints after downsampling (original ~490, downsampled 3x)
  num_workers: 4
  pin_mem: true

  # Path to the included gradient embeddings (450 ROIs x 30 gradient dims)
  gradient_csv_path: /home/amiklos/GitHub/Brain-JEPA/data/gradient_mapping_450.csv

logging:
  folder: /home/amiklos/GitHub/Brain-JEPA/my_experiment/logs
  write_tag: jepa

mask:
  allow_overlap: false
  patch_size: 16
  min_keep: 4
  enc_mask_scale:
  - 0.84
  - 1.0
  pred_mask_R_scale:
  - 0.45
  - 0.6
  pred_mask_T_roi_scale:
  - 0.2
  - 0.6
  pred_mask_R_roi_scale:
  - 0.15
  - 0.3
  pred_mask_T_scale:
  - 0.0
  - 0.4

meta:
  load_checkpoint: false
  model_name: vit_base
  pred_depth: 6
  pred_emb_dim: 384
  read_checkpoint: null
  use_bfloat16: true        # requires Ampere GPU (A100, RTX 30xx/40xx); set false for older GPUs
  accumulation_steps: 32    # effective batch = 4 * 32 = 128
  attn_mode: standard     # set to 'standard' if flash-attn install fails
  add_w: mapping
  downsample: true          # downsample from ~490 to 160 timepoints
  mask_mode: roi_mask
  use_standatdization: false

optimization:
  ema:
  - 0.996
  - 1.0
  epochs: 300               # reduce (e.g. 100) for quick experiments
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.001
  start_lr: 0.00005
  warmup: 40
  weight_decay: 0.04
